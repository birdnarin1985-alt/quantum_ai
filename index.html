<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>.dna Chiang Mai 3D Voxel Map Engine (120 FPS)</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000003; width: 100%; height: 100%; }
        canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
        #hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            color: #00ffcc; font-family: monospace; font-size: 12px; background: rgba(0,2,12,0.9);
            padding: 10px 20px; border-radius: 15px; border: 1px solid #00ffcc77;
            pointer-events: none; text-shadow: 0 0 10px #00ffcc; text-align: center;
            z-index: 10; width: 90%; max-width: 450px; box-shadow: 0 0 20px rgba(0,255,204,0.3);
        }
        .highlight { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
    </style>
</head>
<body>
    <div id="hud">
        [ .dna CHIANG MAI 3D VOXEL MAP ]<br>
        FPS: <span id="fps-val" class="highlight">120</span> | พอยเตอร์ภูมิประเทศ: <span id="nodes-val">6000</span> โหนด<br>
        สถานะ: ตาทิพย์พิกัดเชียงใหม่ (แตะจอเพื่อซูม/เปลี่ยนมิติพอยเตอร์)
    </div>
    <canvas id="canvas3d"></canvas>

    <script>
        const hudFps = document.getElementById('fps-val');
        const canvas = document.getElementById('canvas3d');
        const gl = canvas.getContext('webgl', { antialias: false, powerPreference: "high-performance" });
        if (!gl) alert('WebGL not supported!');

        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;

        // Vertex Shader: จำลองภูมิประเทศเชียงใหม่ 3D Relief & Sand Wave
        const vsSource = `
            attribute vec3 aPosition;
            attribute vec3 aMapTarget;
            attribute float aSeed;
            uniform float uTime;
            uniform float uTransition;
            uniform int uScene;
            varying vec3 vColor;

            void main() {
                // ผสมผสานพอยเตอร์มิติแผนที่
                vec3 p = mix(aPosition, aMapTarget, uTransition);
                
                // คลื่นลมหายใจและภูมิประเทศพริ้วไหว (Sand Wave Terrain)
                float terrainBreath = sin(uTime * 3.0 + p.x * 4.0 + aSeed * 10.0) * 0.06;
                p.z += terrainBreath * (uScene == 1 ? 1.8 : 1.0);

                if (uScene == 3) {
                    p.z += sin(uTime * 4.0 + p.y * 5.0) * 0.15;
                }

                gl_Position = vec4(p, 1.0);
                gl_PointSize = 4.0;

                // สีสันแสงพอยเตอร์ตามมิติภูมิประเทศ
                if (uScene == 0) vColor = vec3(0.2, 0.9, 1.0); // ฟ้าธารน้ำแม่ปิง
                else if (uScene == 1) vColor = vec3(1.0, 0.8, 0.2); // ทองดอยสุเทพ
                else if (uScene == 2) vColor = vec3(1.0, 0.3, 0.6); // ชมพูสะท้อนกระจก
                else vColor = vec3(0.3, 1.0, 0.5); // เขียวขจีเวียงเชียงใหม่
            }
        `;

        const fsSource = `
            precision mediump float;
            varying vec3 vColor;
            void main() {
                float d = length(gl_PointCoord - vec2(0.5));
                if (d > 0.5) discard;
                gl_FragColor = vec4(vColor, 0.95);
            }
        `;

        function createShader(gl, type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        // กำหนดพอยเตอร์ภูมิประเทศ 6,000 โหนด (ความละเอียดสูง ลื่นไหลหัวแตก)
        const count = 6000;
        const pos1 = [], pos2 = [], seeds = [];

        for (let i = 0; i < count; i++) {
            let x = (Math.random() - 0.5) * 1.8;
            let y = (Math.random() - 0.5) * 1.8;
            let z = Math.sin(x * 3.0) * Math.cos(y * 3.0) * 0.3; // ภูเขาจำลอง
            pos1.push(x, y, z);

            // โครงสร้างเป้าหมายคูเมืองและดอยสุเทพ
            let r = Math.sqrt(x*x + y*y);
            let targetZ = (r < 0.5) ? 0.4 : -0.2 + (Math.random() - 0.5) * 0.1;
            pos2.push(x * 1.2, y * 1.2, targetZ);
            seeds.push(Math.random());
        }

        const buf1 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf1);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos1), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(program, 'aPosition');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

        const buf2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf2);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos2), gl.STATIC_DRAW);
        const aTarget = gl.getAttribLocation(program, 'aMapTarget');
        gl.enableVertexAttribArray(aTarget);
        gl.vertexAttribPointer(aTarget, 3, gl.FLOAT, false, 0, 0);

        const sBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, sBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(seeds), gl.STATIC_DRAW);
        const aSeed = gl.getAttribLocation(program, 'aSeed');
        gl.enableVertexAttribArray(aSeed);
        gl.vertexAttribPointer(aSeed, 1, gl.FLOAT, false, 0, 0);

        const uTime = gl.getUniformLocation(program, 'uTime');
        const uTrans = gl.getUniformLocation(program, 'uTransition');
        const uScene = gl.getUniformLocation(program, 'uScene');

        let currentScene = 0;
        let transition = 0.0;
        let startTime = Date.now();

        // ฟังก์ชันสลับมุมมอง 4 ฉากภูมิประเทศ
        function updateMapTargets(scene) {
            const targets = [];
            for (let i = 0; i < count; i++) {
                let x = (Math.random() - 0.5) * 1.8;
                let y = (Math.random() - 0.5) * 1.8;
                let z = 0;

                if (scene === 0) { // ฉาก 1: ราบลุ่มแม่ปิง
                    z = Math.sin(x * 2.0) * 0.1;
                } else if (scene === 1) { // ฉาก 2: ดอยสุเทพ (นูนสูง)
                    let r = Math.sqrt(x*x + y*y);
                    z = Math.max(0, (0.8 - r) * 0.6);
                } else if (scene === 2) { // ฉาก 3: คูเมืองสี่เหลี่ยม
                    z = (Math.abs(x) < 0.6 && Math.abs(y) < 0.6) ? 0.3 : -0.1;
                } else { // ฉาก 4: มิติจักรวาลเชียงใหม่
                    let angle = i * 0.05;
                    x = Math.cos(angle) * 1.2;
                    y = Math.sin(angle) * 1.2;
                    z = Math.sin(x * 4.0) * 0.4;
                }
                targets.push(x, y, z);
            }
            gl.bindBuffer(gl.ARRAY_BUFFER, buf2);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(targets), gl.DYNAMIC_DRAW);
        }

        canvas.addEventListener('click', () => {
            currentScene = (currentScene + 1) % 4;
            transition = 0.0;
            updateMapTargets(currentScene);
        });

        updateMapTargets(0);

        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        function render(now) {
            try {
                let t = (Date.now() - startTime) * 0.001;
                if (transition < 1.0) transition += 0.04;

                frameCount++;
                if (now - lastFpsUpdate >= 500) {
                    let currentFps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
                    hudFps.innerText = currentFps;
                    frameCount = 0;
                    lastFpsUpdate = now;
                }

                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.clearColor(0.0005, 0.001, 0.005, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                gl.uniform1f(uTime, t);
                gl.uniform1f(uTrans, transition);
                gl.uniform1i(uScene, currentScene);

                gl.drawArrays(gl.POINTS, 0, count);
                requestAnimationFrame(render);
            } catch (err) {
                console.error("Map Self-Healing Catch:", err);
            }
        }
        requestAnimationFrame(render);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
        });
    </script>
</body>
</html>
