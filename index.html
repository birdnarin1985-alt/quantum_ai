<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>.dna Masterpiece: Universal Voxel & Aerial Engine (120 FPS)</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000003; width: 100%; height: 100%; }
        canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
        #hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            color: #00ffcc; font-family: monospace; font-size: 12px; background: rgba(0,2,12,0.92);
            padding: 12px 20px; border-radius: 16px; border: 1px solid #00ffcc88;
            pointer-events: none; text-shadow: 0 0 10px #00ffcc; text-align: center;
            z-index: 10; width: 90%; max-width: 480px; box-shadow: 0 0 25px rgba(0,255,204,0.35);
        }
        .highlight { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
    </style>
</head>
<body>
    <div id="hud">
        [ .dna MASTERPIECE SHOWCASE ENGINE ]<br>
        FPS: <span id="fps-val" class="highlight">120</span> | โหนดพอยเตอร์: <span id="nodes-val">80000</span> โหนด<br>
        โหมดปัจจุบัน: <span id="mode-val" class="highlight">1. ควอนตัมจักรวาล (Quantum Cosmos)</span><br>
        (แตะหน้าจอเพื่อสลับโหมดโชว์เคสระดับจักรวาล)
    </div>
    <canvas id="canvas3d"></canvas>

    <script>
        const hudFps = document.getElementById('fps-val');
        const hudMode = document.getElementById('mode-val');
        const canvas = document.getElementById('canvas3d');
        const gl = canvas.getContext('webgl', { antialias: false, powerPreference: "high-performance" });
        if (!gl) alert('WebGL not supported!');

        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;

        const vsSource = `
            attribute vec3 aPosition;
            attribute vec3 aTarget;
            attribute float aSeed;
            uniform float uTime;
            uniform float uTransition;
            uniform int uMode;
            varying vec3 vColor;

            void main() {
                vec3 p = mix(aPosition, aTarget, uTransition);
                
                // คลื่นลมหายใจและพลังงานพริ้วไหว
                float wave = sin(uTime * 3.0 + aSeed * 20.0) * 0.05;
                p.z += wave * (uMode == 1 ? 2.0 : 1.0);

                if (uMode == 3) {
                    // โหมดลอยฟ้าเชียงใหม่ ปรับมุมมอง Tilt ลงมาด้านล่าง
                    vec3 camPos = vec3(0.0, -1.0, 0.7);
                    vec3 wp = p - camPos;
                    gl_Position = vec4(wp.x, wp.z * 1.2 + 0.1, -wp.y * 0.5 + 0.9, wp.y + 1.7);
                    gl_PointSize = 3.0;
                } else {
                    gl_Position = vec4(p, 1.0);
                    gl_PointSize = 4.0;
                }

                // สีสันตามโหมดโชว์เคส
                if (uMode == 0) {
                    vColor = vec3(1.0, 0.8, 0.2); // ทองควอนตัม
                } else if (uMode == 1) {
                    vColor = vec3(0.1, 0.9, 1.0); // ฟ้าเนบิวลาจักรวาล
                } else if (uMode == 2) {
                    vColor = vec3(1.0, 0.3, 0.6); // ชมพูสะท้อนมิติกระจก
                } else {
                    // โหมดลอยฟ้าเชียงใหม่ (เปลี่ยนสีตามภูมิประเทศ)
                    if (aSeed < 0.3) vColor = vec3(0.1, 0.8, 0.4); // ดอยสุเทพ
                    else if (aSeed < 0.6) vColor = vec3(0.2, 0.6, 1.0); // แม่ปิง
                    else vColor = vec3(0.9, 0.7, 0.2); // คูเมือง
                }
            }
        `;

        const fsSource = `
            precision mediump float;
            varying vec3 vColor;
            void main() {
                float d = length(gl_PointCoord - vec2(0.5));
                if (d > 0.5) discard;
                gl_FragColor = vec4(vColor, 0.92);
            }
        `;

        function createShader(gl, type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        const count = 80000;
        const pos1 = [], pos2 = [], seeds = [];

        for (let i = 0; i < count; i++) {
            let u = Math.random();
            let v = Math.random();
            let theta = u * 2.0 * Math.PI;
            let phi = Math.acos(2.0 * v - 1.0);
            let r = Math.cbrt(Math.random()) * 1.3;
            
            let x = r * Math.sin(phi) * Math.cos(theta);
            let y = r * Math.sin(phi) * Math.sin(theta);
            let z = r * Math.cos(phi);
            pos1.push(x, y, z);
            pos2.push(-x * 1.2, y * 1.2, z * 1.2);
            seeds.push(Math.random());
        }

        const buf1 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf1);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos1), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(program, 'aPosition');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

        const buf2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf2);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos2), gl.STATIC_DRAW);
        const aTarget = gl.getAttribLocation(program, 'aTarget');
        gl.enableVertexAttribArray(aTarget);
        gl.vertexAttribPointer(aTarget, 3, gl.FLOAT, false, 0, 0);

        const sBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, sBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(seeds), gl.STATIC_DRAW);
        const aSeed = gl.getAttribLocation(program, 'aSeed');
        gl.enableVertexAttribArray(aSeed);
        gl.vertexAttribPointer(aSeed, 1, gl.FLOAT, false, 0, 0);

        const uTime = gl.getUniformLocation(program, 'uTime');
        const uTrans = gl.getUniformLocation(program, 'uTransition');
        const uMode = gl.getUniformLocation(program, 'uMode');

        let showcaseMode = 0;
        let transition = 0.0;
        let startTime = Date.now();

        const modeNames = [
            "1. ควอนตัมจักรวาล (Quantum Cosmos)",
            "2. ใยแก้วจักรวาล (Cosmic Web)",
            "3. มิติกระจกสะท้อน (Mirror Matrix)",
            "4. ตาทิพย์ลอยฟ้าเชียงใหม่ (100m Aerial Map)"
        ];

        function updateShowcaseTargets(mode) {
            const targets = [];
            for (let i = 0; i < count; i++) {
                let x = 0, y = 0, z = 0;
                if (mode === 0) {
                    x = (Math.random() - 0.5) * 1.5;
                    y = (Math.random() - 0.5) * 1.5;
                    z = (Math.random() - 0.5) * 0.5;
                } else if (mode === 1) {
                    let angle = (i / count) * Math.PI * 12;
                    let r = (i / count) * 1.4;
                    x = Math.cos(angle) * r;
                    y = Math.sin(angle) * r;
                    z = Math.sin(x * 4.0) * 0.3;
                } else if (mode === 2) {
                    x = (Math.random() - 0.5) * 2.0;
                    y = (Math.random() - 0.5) * 2.0;
                    z = (Math.random() - 0.5) * 0.8;
                } else {
                    // โหมดลอยฟ้าเชียงใหม่
                    x = (Math.random() - 0.5) * 2.2;
                    y = (Math.random() - 0.5) * 2.2;
                    let r = Math.sqrt(x*x + y*y);
                    z = (r < 0.4) ? 0.3 : (Math.sin(x * 3.0) * Math.cos(y * 3.0)) * 0.2;
                }
                targets.push(x, y, z);
            }
            gl.bindBuffer(gl.ARRAY_BUFFER, buf2);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(targets), gl.DYNAMIC_DRAW);
        }

        canvas.addEventListener('click', () => {
            showcaseMode = (showcaseMode + 1) % 4;
            transition = 0.0;
            updateShowcaseTargets(showcaseMode);
            hudMode.innerText = modeNames[showcaseMode];
        });

        updateShowcaseTargets(0);

        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        function render(now) {
            try {
                let t = (Date.now() - startTime) * 0.001;
                if (transition < 1.0) transition += 0.035;

                frameCount++;
                if (now - lastFpsUpdate >= 500) {
                    let currentFps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
                    hudFps.innerText = currentFps;
                    frameCount = 0;
                    lastFpsUpdate = now;
                }

                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.clearColor(0.0005, 0.001, 0.005, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                gl.uniform1f(uTime, t);
                gl.uniform1f(uTrans, transition);
                gl.uniform1i(uMode, showcaseMode);

                gl.drawArrays(gl.POINTS, 0, count);
                requestAnimationFrame(render);
            } catch (err) {
                console.error("Masterpiece Self-Healing Catch:", err);
            }
        }
        requestAnimationFrame(render);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
        });
    </script>
</body>
</html>
