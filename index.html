<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>.dna Recursive Pointer Graph Morphing Engine (120 FPS)</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000004; width: 100%; height: 100%; touch-action: none; }
        canvas { width: 100%; height: 100%; display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }
        #hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            color: #00ffcc; font-family: monospace; font-size: 12px; background: rgba(0,2,12,0.92);
            padding: 12px 20px; border-radius: 16px; border: 1px solid #00ffcc88;
            pointer-events: none; text-shadow: 0 0 10px #00ffcc; text-align: center;
            z-index: 10; width: 90%; max-width: 520px; box-shadow: 0 0 25px rgba(0,255,204,0.35);
        }
        .highlight { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
    </style>
</head>
<body>
    <div id="hud">
        [ .dna RECURSIVE POINTER MORPHING ]<br>
        FPS: <span id="fps-val" class="highlight">120</span> | โหนดเลเยอร์กราฟ: <span id="nodes-val">100000</span> โหนด<br>
        สถานะ: แปลงร่างอัตโนมัติ (เชียงใหม่ -> ก้อนอิฐ -> ต้นไม้) | (แตะจอเปลี่ยนเลเยอร์)
    </div>
    <canvas id="canvas3d"></canvas>

    <script>
        const hudFps = document.getElementById('fps-val');
        const canvas = document.getElementById('canvas3d');
        const gl = canvas.getContext('webgl', { antialias: false, powerPreference: "high-performance" });
        if (!gl) alert('WebGL not supported!');

        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;

        // Vertex Shader: Pure Mathematical Morphing across Layer Pointer Graph
        const vsSource = `
            attribute vec3 aBasePos;
            attribute float aSeed;
            uniform float uTime;
            uniform float uMorphState; // ควบคุมสถานะการแปลงร่าง (0: เชียงใหม่, 1: ก้อนอิฐ, 2: ต้นไม้)
            uniform vec2 uRotation;
            uniform float uZoom;
            varying vec3 vColor;

            vec3 rotate(vec3 p, vec2 rot) {
                float cX = cos(rot.y), sX = sin(rot.y);
                float cY = cos(rot.x), sY = sin(rot.x);
                mat3 rotY = mat3(cY, 0.0, sY, 0.0, 1.0, 0.0, -sY, 0.0, cY);
                mat3 rotX = mat3(1.0, 0.0, 0.0, 0.0, cX, -sX, 0.0, sX, cX);
                return rotX * rotY * p;
            }

            void main() {
                vec3 p = aBasePos;

                // เลเยอร์ 0: ภูมิประเทศเชียงใหม่ (Landscape Field)
                float r = length(p.xy);
                float cityZ = max(-0.5, (1.5 - r * 0.8)) * (sin(p.x * 1.5) * cos(p.y * 1.5) * 0.3 + 0.6);
                if (r < 0.35) cityZ = 0.1;
                vec3 layerCity = vec3(p.x, p.y, cityZ);

                // เลเยอร์ 1: โครงสร้างก้อนอิฐ (Parametric Brick Matrix - ไร้การฮาร์ดโค้ด)
                float bx = sin(p.x * 6.0 + aSeed * 5.0) * 0.8;
                float by = cos(p.y * 6.0 + aSeed * 5.0) * 0.8;
                float bz = sin(p.x * 3.0) * cos(p.y * 3.0) * 0.5;
                vec3 layerBrick = vec3(bx, by, bz);

                // เลเยอร์ 2: รูปทรงต้นไม้ธรรมชาติ (Fractal Tree Canopy Field)
                float angle = aSeed * 6.28318;
                float radius = fract(aSeed * 43.17) * 0.9;
                float tx = cos(angle) * radius * (1.5 - p.z);
                float ty = sin(angle) * radius * (1.5 - p.z);
                float tz = p.z * 0.8 + fract(aSeed * 11.1) * 0.4 - 0.2;
                vec3 layerTree = vec3(tx, ty, tz);

                // ระบบ Morphing อัตโนมัติผ่านสมการคณิตศาสตร์ (Smoothstep Interpolation)
                vec3 morphedPos = mix(layerCity, layerBrick, smoothstep(0.0, 1.0, uMorphState));
                morphedPos = mix(morphedPos, layerTree, smoothstep(1.0, 2.0, uMorphState));

                // ลมหายใจสนามพลังควอนตัม
                morphedPos.z += sin(uTime * 2.0 + aSeed * 10.0) * 0.03;

                vec3 rotatedP = rotate(morphedPos, uRotation);
                rotatedP *= uZoom;

                gl_Position = vec4(rotatedP.x, rotatedP.z * 1.4 + 0.1, -rotatedP.y * 0.4 + 1.2, rotatedP.y * 0.5 + 2.0);
                gl_PointSize = 2.8;

                // เปลี่ยนสีตามเลเยอร์และสถานะการแปลงร่าง
                if (uMorphState < 1.0) {
                    vColor = vec3(0.1, 0.8, 0.5); // สีเขียวธรรมชาติเชียงใหม่
                } else if (uMorphState < 2.0) {
                    vColor = vec3(0.9, 0.4, 0.2); // สีอิฐสถาปัตยกรรม
                } else {
                    vColor = vec3(0.2, 0.9, 0.3); // สีใบไม้รุกขชาติ
                }
            }
        `;

        const fsSource = `
            precision mediump float;
            varying vec3 vColor;
            void main() {
                float d = length(gl_PointCoord - vec2(0.5));
                if (d > 0.5) discard;
                gl_FragColor = vec4(vColor, 0.94);
            }
        `;

        function createShader(gl, type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        // สร้างข้อมูลพื้นฐาน 100,000 โหนดสำหรับ Recursive Pointer Graph
        const count = 100000;
        const basePositions = [];
        const seeds = [];

        for (let i = 0; i < count; i++) {
            let x = (Math.random() - 0.5) * 3.0;
            let y = (Math.random() - 0.5) * 3.0;
            let z = (Math.random() - 0.5) * 1.5;
            basePositions.push(x, y, z);
            seeds.push(Math.random());
        }

        const posBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(basePositions), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(program, 'aBasePos');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

        const sBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, sBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(seeds), gl.STATIC_DRAW);
        const aSeed = gl.getAttribLocation(program, 'aSeed');
        gl.enableVertexAttribArray(aSeed);
        gl.vertexAttribPointer(aSeed, 1, gl.FLOAT, false, 0, 0);

        const uTime = gl.getUniformLocation(program, 'uTime');
        const uMorphState = gl.getUniformLocation(program, 'uMorphState');
        const uRotation = gl.getUniformLocation(program, 'uRotation');
        const uZoom = gl.getUniformLocation(program, 'uZoom');

        let morphTarget = 0.0;
        let currentMorph = 0.0;
        let isDragging = false;
        let prevMousePos = { x: 0, y: 0 };
        let rotation = { x: 0.4, y: 0.3 };
        let zoom = 1.0;

        canvas.addEventListener('click', () => {
            morphTarget = (morphTarget + 1.0) % 3.0;
        });

        canvas.addEventListener('pointerdown', (e) => {
            isDragging = true;
            prevMousePos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            let deltaX = e.clientX - prevMousePos.x;
            let deltaY = e.clientY - prevMousePos.y;
            rotation.x += deltaX * 0.008;
            rotation.y += deltaY * 0.008;
            prevMousePos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => { isDragging = false; });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoom += e.deltaY * -0.001;
            zoom = Math.max(0.4, Math.min(2.5, zoom));
        }, { passive: false });

        let startTime = Date.now();
        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        function render(now) {
            try {
                let t = (Date.now() - startTime) * 0.001;

                // สมูทการเปลี่ยนรูปสถานะ Morphing อย่างนุ่มนวล
                currentMorph += (morphTarget - currentMorph) * 0.05;

                if (!isDragging) {
                    rotation.x += 0.0015;
                }

                frameCount++;
                if (now - lastFpsUpdate >= 500) {
                    let currentFps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
                    hudFps.innerText = currentFps;
                    frameCount = 0;
                    lastFpsUpdate = now;
                }

                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.clearColor(0.0002, 0.0006, 0.003, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                gl.uniform1f(uTime, t);
                gl.uniform1f(uMorphState, currentMorph);
                gl.uniform2f(uRotation, rotation.x, rotation.y);
                gl.uniform1f(uZoom, zoom);

                gl.drawArrays(gl.POINTS, 0, count);
                requestAnimationFrame(render);
            } catch (err) {
                console.error("Morphing Engine Self-Healing Catch:", err);
            }
        }
        requestAnimationFrame(render);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
        });
    </script>
</body>
</html>
