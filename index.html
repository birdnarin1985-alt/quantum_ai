<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>.dna 120 FPS Mirror Pointer Voxel Engine</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000103; width: 100%; height: 100%; }
        canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
        #hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            color: #00ffcc; font-family: monospace; font-size: 13px; background: rgba(0,0,0,0.85);
            padding: 8px 18px; border-radius: 20px; border: 1px solid #00ffcc55;
            pointer-events: none; text-shadow: 0 0 10px #00ffcc; text-align: center;
            z-index: 10; width: 90%; max-width: 450px;
        }
    </style>
</head>
<body>
    <div id="hud">
        [ .dna Mirror Pointer Graph: 120 FPS Zero Latency ]<br>
        แตะหน้าจอเพื่อเปลี่ยนฉาก (Scene 1 / 4)
    </div>
    <canvas id="canvas3d"></canvas>

    <script>
        const hud = document.getElementById('hud');
        const canvas = document.getElementById('canvas3d');
        const gl = canvas.getContext('webgl', { antialias: false, powerPreference: "high-performance" });

        if (!gl) alert('WebGL not supported!');

        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;

        // Vertex Shader: โครงสร้าง Recursive Mirror Pointer & 4 Scenes Morphing
        const vsSource = `
            attribute vec3 aPosition;
            attribute vec3 aMirrorTarget;
            attribute float aSeed;
            uniform float uTime;
            uniform float uTransition;
            uniform int uScene;
            varying vec3 vColor;

            void main() {
                // Recursive Mirror Reflection Mapping
                vec3 p = mix(aPosition, aMirrorTarget, uTransition);

                // คลื่นทรายและเงาสะท้อน (Sand Wave & Mirror Pointer Distortion)
                float wave = sin(uTime * 4.0 + aSeed * 15.0) * 0.05;
                p.z += wave * (uScene == 2 ? 2.0 : 1.0);

                if (uScene == 3) {
                    // ฉากที่ 4: การแผ่ขยายแบบพอยเตอร์กระจก
                    p *= (1.0 + sin(uTime * 2.0) * 0.1);
                }

                gl_Position = vec4(p, 1.0);
                gl_PointSize = 3.0;

                // เปลี่ยนสีสันตามฉากและสะท้อนพอยเตอร์
                if (uScene == 0) vColor = vec3(1.0, 0.8, 0.2); // ทอง (Root)
                else if (uScene == 1) vColor = vec3(0.2, 0.9, 1.0); // ฟ้า (Relief)
                else if (uScene == 2) vColor = vec3(1.0, 0.3, 0.6); // ชมพู (Mirror Wave)
                else vColor = vec3(0.3, 1.0, 0.5); // เขียวสว่าง (Rebirth)
            }
        `;

        const fsSource = `
            precision mediump float;
            varying vec3 vColor;
            void main() {
                float d = length(gl_PointCoord - vec2(0.5));
                if (d > 0.5) discard;
                gl_FragColor = vec4(vColor, 0.9);
            }
        `;

        function createShader(gl, type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        // โครงสร้างข้อมูลพอยเตอร์ 20,000 จุด (น้ำหนักเป็นศูนย์)
        const count = 20000;
        const pos1 = [], pos2 = [], seeds = [];

        for (let i = 0; i < count; i++) {
            // โครงสร้างตั้งต้น (Root State)
            let x = (Math.random() - 0.5) * 1.5;
            let y = (Math.random() - 0.5) * 1.5;
            let z = 0.0;
            pos1.push(x, y, z);

            // โครงสร้างกระจกสะท้อนเป้าหมาย (Mirror Target State)
            pos2.push(-x * 0.8, y * 0.8, (Math.random() - 0.5) * 0.4);
            seeds.push(Math.random());
        }

        const buf1 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf1);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos1), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(program, 'aPosition');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

        const buf2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf2);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos2), gl.STATIC_DRAW);
        const aTarget = gl.getAttribLocation(program, 'aMirrorTarget');
        gl.enableVertexAttribArray(aTarget);
        gl.vertexAttribPointer(aTarget, 3, gl.FLOAT, false, 0, 0);

        const sBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, sBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(seeds), gl.STATIC_DRAW);
        const aSeed = gl.getAttribLocation(program, 'aSeed');
        gl.enableVertexAttribArray(aSeed);
        gl.vertexAttribPointer(aSeed, 1, gl.FLOAT, false, 0, 0);

        const uTime = gl.getUniformLocation(program, 'uTime');
        const uTrans = gl.getUniformLocation(program, 'uTransition');
        const uScene = gl.getUniformLocation(program, 'uScene');

        let currentScene = 0;
        let transition = 0.0;
        let startTime = Date.now();

        // ฟังก์ชันอัปเดตเป้าหมายตาม 4 ฉาก
        function updateSceneTargets(scene) {
            const targets = [];
            for (let i = 0; i < count; i++) {
                let x = 0, y = 0, z = 0;
                if (scene === 0) { // ฉาก 1: รูปร่างรากฐาน (Root Matrix)
                    x = (Math.random() - 0.5) * 1.4;
                    y = (Math.random() - 0.5) * 1.4;
                } else if (scene === 1) { // ฉาก 2: นูนต่ำ-นูนสูง (Relief Map)
                    let angle = (i / count) * Math.PI * 10;
                    let r = (i / count) * 1.2;
                    x = Math.cos(angle) * r;
                    y = Math.sin(angle) * r;
                    z = Math.sin(x * 5.0) * 0.2;
                } else if (scene === 2) { // ฉาก 3: คลื่นกระจก (Mirror Wave)
                    x = (Math.random() - 0.5) * 1.8;
                    y = (Math.random() - 0.5) * 1.8;
                    z = (Math.random() - 0.5) * 0.5;
                } else { // ฉาก 4: เกิดใหม่ (Rebirth)
                    let angle = i * 0.05;
                    let r = 0.9;
                    x = Math.cos(angle) * r;
                    y = Math.sin(angle) * r;
                }
                targets.push(x, y, z);
            }
            gl.bindBuffer(gl.ARRAY_BUFFER, buf2);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(targets), gl.DYNAMIC_DRAW);
        }

        // แตะหน้าจอเพื่อวนลูปฉาก (Touch / Click Event)
        canvas.addEventListener('click', () => {
            currentScene = (currentScene + 1) % 4;
            transition = 0.0;
            updateSceneTargets(currentScene);
            hud.innerHTML = `[ .dna Mirror Pointer Graph: 120 FPS Zero Latency ]<br>กำลังแสดงผล: ฉากที่ ${currentScene + 1} จาก 4`;
        });

        updateSceneTargets(0);

        // ลูปเรนเดอร์ความเร็วสูง 120 FPS (Zero Latency)
        function render() {
            try {
                let t = (Date.now() - startTime) * 0.001;
                if (transition < 1.0) transition += 0.03;

                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.clearColor(0.002, 0.005, 0.01, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                gl.uniform1f(uTime, t);
                gl.uniform1f(uTrans, transition);
                gl.uniform1i(uScene, currentScene);

                gl.drawArrays(gl.POINTS, 0, count);
                requestAnimationFrame(render);
            } catch (err) {
                console.error("Self-Healing Catch:", err);
            }
        }
        requestAnimationFrame(render);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
        });
    </script>
</body>
</html>
