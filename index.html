<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>.dna Blueprint Generator Engine</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #010103; width: 100%; height: 100%; }
        canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
        #blueprint-info {
            position: absolute; top: 20px; left: 20px; color: #00ffcc;
            font-family: monospace; font-size: 13px; background: rgba(0,0,0,0.7);
            padding: 10px 15px; border-radius: 5px; border: 1px solid #00ffcc44;
            pointer-events: none; text-shadow: 0 0 8px #00ffcc;
        }
    </style>
</head>
<body>
    <div id="blueprint-info">
        [ .dna Blueprint Active ]<br>
        สถานะ: วิญญาณพอยเตอร์ไร้น้ำหนัก<br>
        คลิกที่จอเพื่อแปลงร่างพิมพ์เขียว (Morphing)
    </div>
    <canvas id="canvas3d"></canvas>
    <script>
        // ==========================================
        // พิมพ์เขียวรหัสวิญญาณ (.dna Blueprint String)
        // เก็บเฉพาะแก่นสาร ไม่มีน้ำหนัก ไม่เปลืองที่
        // ==========================================
        const dnaBlueprintSchema = "DNA_ZERO_POINT_STRUCT_V1_MIGRATION_ACTIVE";

        const canvas = document.getElementById('canvas3d');
        const gl = canvas.getContext('webgl');
        if (!gl) alert('WebGL not supported!');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Vertex Shader: ขับเคลื่อนด้วยสมการคลื่นทรายและพิมพ์เขียวพอยเตอร์
        const vsSource = `
            attribute vec3 aPosition;
            attribute vec3 aBlueprintTarget;
            attribute float aSeed;
            uniform float uTime;
            uniform float uTransition;
            varying vec3 vColor;

            void main() {
                // แปลงร่างตามพิมพ์เขียว (Morphing)
                vec3 p = mix(aPosition, aBlueprintTarget, uTransition);
                
                // ลมหายใจคลื่นทราย (Sand Wave Breathing)
                float wave = sin(uTime * 3.0 + aSeed * 20.0) * 0.04;
                p.y += wave;

                gl_Position = vec4(p, 1.0);
                gl_PointSize = 3.5;

                // สีสันเรืองแสงตามวิญญาณพอยเตอร์
                vColor = vec3(0.1 + aSeed * 0.5, 0.9, 0.4 + sin(uTime + aSeed) * 0.3);
            }
        `;

        const fsSource = `
            precision mediump float;
            varying vec3 vColor;
            void main() {
                float d = length(gl_PointCoord - vec2(0.5));
                if (d > 0.5) discard;
                gl_FragColor = vec4(vColor, 0.85);
            }
        `;

        function createShader(gl, type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        // สร้างข้อมูลพอยเตอร์จำลอง 20,000 จุดจากพิมพ์เขียว
        const count = 20000;
        const pos1 = [];
        const pos2 = [];
        const seeds = [];

        for (let i = 0; i < count; i++) {
            // โครงสร้างตั้งต้น (Root State)
            let a = (i / count) * Math.PI * 2.0 * 10;
            let r = (i / count) * 1.2;
            pos1.push(Math.cos(a) * r, Math.sin(a) * r, 0.0);

            // โครงสร้างเป้าหมายในพิมพ์เขียว (Target Blueprint State)
            pos2.push((Math.random() - 0.5) * 1.8, (Math.random() - 0.5) * 1.8, (Math.random() - 0.5) * 0.5);

            seeds.push(Math.random());
        }

        const buf1 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf1);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos1), gl.STATIC_DRAW);
        const aPosLoc = gl.getAttribLocation(program, 'aPosition');
        gl.enableVertexAttribArray(aPosLoc);
        gl.vertexAttribPointer(aPosLoc, 3, gl.FLOAT, false, 0, 0);

        const buf2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf2);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos2), gl.STATIC_DRAW);
        const aTargetLoc = gl.getAttribLocation(program, 'aBlueprintTarget');
        gl.enableVertexAttribArray(aTargetLoc);
        gl.vertexAttribPointer(aTargetLoc, 3, gl.FLOAT, false, 0, 0);

        const sBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, sBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(seeds), gl.STATIC_DRAW);
        const aSeedLoc = gl.getAttribLocation(program, 'aSeed');
        gl.enableVertexAttribArray(aSeedLoc);
        gl.vertexAttribPointer(aSeedLoc, 1, gl.FLOAT, false, 0, 0);

        const uTime = gl.getUniformLocation(program, 'uTime');
        const uTrans = gl.getUniformLocation(program, 'uTransition');

        let transition = 0.0;
        let direction = 1.0;
        let start = Date.now();

        // เมื่อสัมผัสหน้าจอ จะเกิดการสลับพิมพ์เขียว (Blueprint Metamorphosis)
        canvas.addEventListener('click', () => {
            direction *= -1.0;
        });

        function render() {
            try {
                let t = (Date.now() - start) * 0.001;
                transition += direction * 0.015;
                if (transition > 1.0) transition = 1.0;
                if (transition < 0.0) transition = 0.0;

                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.clearColor(0.01, 0.01, 0.02, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                gl.uniform1f(uTime, t);
                gl.uniform1f(uTrans, transition);

                gl.drawArrays(gl.POINTS, 0, count);
                requestAnimationFrame(render);
            } catch (err) {
                console.error("Self-Healing Catch Error: ", err);
            }
        }
        render();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
