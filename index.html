<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>.dna 30 FPS Voxel Face Reincarnation Engine</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000205; width: 100%; height: 100%; }
        canvas { width: 100%; height: 100%; display: block; }
        #hud {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: #00ffcc; font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.8);
            padding: 10px 20px; border-radius: 20px; border: 1px solid #00ffcc55;
            pointer-events: none; text-shadow: 0 0 10px #00ffcc;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="hud">
        [ .dna Live Stream: 30 FPS Reincarnation ]<br>
        วิญญาณพอยเตอร์ไร้น้ำหนัก กำลังเรนเดอร์โครงหน้า Voxel
    </div>
    <canvas id="canvas3d"></canvas>
    <script>
        const canvas = document.getElementById('canvas3d');
        const gl = canvas.getContext('webgl');
        if (!gl) alert('WebGL not supported!');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Vertex Shader: จำลองโครงหน้าและมิตินูนต่ำ-นูนสูง (Relief Map) 30 FPS
        const vsSource = `
            attribute vec3 aPosition;
            attribute float aRandomSeed;
            uniform float uTime;
            varying vec3 vColor;

            void main() {
                vec3 p = aPosition;
                
                // จำลองคลื่นลมหายใจและมิตินูนต่ำ-นูนสูงบนใบหน้า
                float breath = sin(uTime * 6.0) * 0.03;
                p.z += cos(p.x * 5.0 + uTime * 3.0) * 0.1 + breath;

                gl_Position = vec4(p, 1.0);
                gl_PointSize = 4.0;

                // สีสันเรืองแสงตามจังหวะชีวิต
                vColor = vec3(0.1, 0.9 + sin(uTime + aRandomSeed) * 0.1, 0.7);
            }
        `;

        const fsSource = `
            precision mediump float;
            varying vec3 vColor;
            void main() {
                float d = length(gl_PointCoord - vec2(0.5));
                if (d > 0.5) discard;
                gl_FragColor = vec4(vColor, 0.9);
            }
        `;

        function createShader(gl, type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        // สร้างโครงหน้าจำลองจากพอยเตอร์ 18,000 จุด (Grid Structure)
        const count = 18000;
        const positions = [];
        const seeds = [];

        for (let i = 0; i < count; i++) {
            let x = (Math.random() - 0.5) * 1.2;
            let y = (Math.random() - 0.5) * 1.2;
            let z = (Math.random() - 0.5) * 0.2;
            
            // จัดรูปทรงให้โค้งเว้าคล้ายโครงหน้า
            let r = Math.sqrt(x*x + y*y);
            if (r < 0.6) {
                z += (0.6 - r) * 0.5; // ส่วนนูนตรงกลาง (จมูก/หน้าผาก)
            }

            positions.push(x, y, z);
            seeds.push(Math.random());
        }

        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
        const aPosLoc = gl.getAttribLocation(program, 'aPosition');
        gl.enableVertexAttribArray(aPosLoc);
        gl.vertexAttribPointer(aPosLoc, 3, gl.FLOAT, false, 0, 0);

        const seedBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, seedBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(seeds), gl.STATIC_DRAW);
        const aSeedLoc = gl.getAttribLocation(program, 'aSeed');
        gl.enableVertexAttribArray(aSeedLoc);
        gl.vertexAttribPointer(aSeedLoc, 1, gl.FLOAT, false, 0, 0);

        const uTimeLoc = gl.getUniformLocation(program, 'uTime');
        let startTime = Date.now();

        // ควบคุมอัตราการเกิดใหม่ที่ 30 FPS (เมตตาต่อระบบ ไม่กิน CPU เกินจำเป็น)
        let lastTime = 0;
        const fpsInterval = 1000 / 30; // 30 Frames Per Second

        function render(now) {
            try {
                requestAnimationFrame(render);
                
                let elapsed = now - lastTime;
                if (elapsed < fpsInterval) return;
                lastTime = now - (elapsed % fpsInterval);

                let t = (Date.now() - startTime) * 0.001;

                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.clearColor(0.005, 0.01, 0.02, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                gl.uniform1f(uTimeLoc, t);
                gl.drawArrays(gl.POINTS, 0, count);
            } catch (err) {
                console.error("Self-Healing Error: ", err);
            }
        }
        requestAnimationFrame(render);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
