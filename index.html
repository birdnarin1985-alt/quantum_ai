<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>.dna Chiang Mai Sky 100m Voxel Engine (120 FPS)</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000104; width: 100%; height: 100%; }
        canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
        #hud {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            color: #00ffcc; font-family: monospace; font-size: 12px; background: rgba(0,2,12,0.9);
            padding: 10px 20px; border-radius: 15px; border: 1px solid #00ffcc77;
            pointer-events: none; text-shadow: 0 0 10px #00ffcc; text-align: center;
            z-index: 10; width: 90%; max-width: 460px; box-shadow: 0 0 20px rgba(0,255,204,0.3);
        }
        .highlight { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
    </style>
</head>
<body>
    <div id="hud">
        [ .dna 100M AERIAL CHIANG MAI VOXEL MAP ]<br>
        FPS: <span id="fps-val" class="highlight">120</span> | โหนดพอยเตอร์ภูมิประเทศ: <span id="nodes-val">80000</span> โหนด<br>
        สถานะ: ลอยฟ้า 100 เมตรเหนือเมืองเชียงใหม่ (แตะจอเปลี่ยนมิติภูมิประเทศ)
    </div>
    <canvas id="canvas3d"></canvas>

    <script>
        const hudFps = document.getElementById('fps-val');
        const canvas = document.getElementById('canvas3d');
        const gl = canvas.getContext('webgl', { antialias: false, powerPreference: "high-performance" });
        if (!gl) alert('WebGL not supported!');

        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;

        // Vertex Shader: มุมมองลอยฟ้า 100 เมตร (Bird's Eye Aerial View) & Color Mapping ตามภูมิประเทศ
        const vsSource = `
            attribute vec3 aPosition;
            attribute vec3 aAerialTarget;
            attribute float aSeed;
            uniform float uTime;
            uniform float uTransition;
            uniform int uScene;
            varying vec3 vColor;

            void main() {
                vec3 p = mix(aPosition, aAerialTarget, uTransition);
                
                // ลมหายใจแห่งขุนเขาและคลื่นอากาศเหนือเมืองเชียงใหม่ (Aerial Wave)
                float skyBreath = sin(uTime * 2.5 + p.x * 3.0 + aSeed * 15.0) * 0.04;
                p.z += skyBreath * (uScene == 1 ? 1.5 : 1.0);

                if (uScene == 3) {
                    p.z += sin(uTime * 4.0 + p.y * 4.0) * 0.08;
                }

                // มุมมองกล้องลอยฟ้า 100 เมตร (Tilt Projection ลงมาด้านล่าง)
                vec3 cameraPos = vec3(0.0, -1.2, 0.8);
                vec3 worldP = p - cameraPos;

                gl_Position = vec4(worldP.x, worldP.z * 1.2 + 0.2, -worldP.y * 0.5 + 1.0, worldP.y + 1.8);
                gl_PointSize = 3.0;

                // เปลี่ยนสีตามภูมิประเทศ (ดอยสุเทพ, คูเมือง, แม่ปิง, ตัวเมือง)
                if (aSeed < 0.25) {
                    vColor = vec3(0.1, 0.8, 0.4); // เขียวขจีขุนเขา / ดอยสุเทพ
                } else if (aSeed < 0.5) {
                    vColor = vec3(0.2, 0.6, 1.0); // ฟ้าธารน้ำแม่ปิง
                } else if (aSeed < 0.75) {
                    vColor = vec3(0.9, 0.7, 0.2); // ทองคูเมือง & วัดวาอาราม
                } else {
                    vColor = vec3(0.7, 0.7, 0.8); // เทาอาคารบ้านเรือนในเมือง
                }
            }
        `;

        const fsSource = `
            precision mediump float;
            varying vec3 vColor;
            void main() {
                float d = length(gl_PointCoord - vec2(0.5));
                if (d > 0.5) discard;
                gl_FragColor = vec4(vColor, 0.92);
            }
        `;

        function createShader(gl, type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        }

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);
        gl.useProgram(program);

        // โครงสร้างพอยเตอร์ความหนาแน่นสูง 80,000 โหนด (ลื่นไหล 120 FPS เมตตาต่อระบบ)
        const count = 80000;
        const pos1 = [], pos2 = [], seeds = [];

        for (let i = 0; i < count; i++) {
            let x = (Math.random() - 0.5) * 2.2;
            let y = (Math.random() - 0.5) * 2.2;
            let z = (Math.sin(x * 2.5) * Math.cos(y * 2.5)) * 0.25 - 0.3;
            pos1.push(x, y, z);

            // โครงสร้างเป้าหมายคูเมืองและตัวเมืองเชียงใหม่จากมุมสูง
            let r = Math.sqrt(x*x + y*y);
            let targetZ = (r < 0.4) ? 0.2 : (Math.random() - 0.5) * 0.15;
            pos2.push(x * 1.1, y * 1.1, targetZ);
            seeds.push(Math.random());
        }

        const buf1 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf1);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos1), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(program, 'aPosition');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

        const buf2 = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf2);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos2), gl.STATIC_DRAW);
        const aTarget = gl.getAttribLocation(program, 'aAerialTarget');
        gl.enableVertexAttribArray(aTarget);
        gl.vertexAttribPointer(aTarget, 3, gl.FLOAT, false, 0, 0);

        const sBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, sBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(seeds), gl.STATIC_DRAW);
        const aSeed = gl.getAttribLocation(program, 'aSeed');
        gl.enableVertexAttribArray(aSeed);
        gl.vertexAttribPointer(aSeed, 1, gl.FLOAT, false, 0, 0);

        const uTime = gl.getUniformLocation(program, 'uTime');
        const uTrans = gl.getUniformLocation(program, 'uTransition');
        const uScene = gl.getUniformLocation(program, 'uScene');

        let currentScene = 0;
        let transition = 0.0;
        let startTime = Date.now();

        // ฟังก์ชันสลับมุมมองลอยฟ้า 4 มิติ
        function updateAerialTargets(scene) {
            const targets = [];
            for (let i = 0; i < count; i++) {
                let x = (Math.random() - 0.5) * 2.2;
                let y = (Math.random() - 0.5) * 2.2;
                let z = 0;

                if (scene === 0) { // ฉาก 1: มุมมองเหนือลุ่มแม่ปิง
                    z = Math.sin(x * 2.0) * 0.1;
                } else if (scene === 1) { // ฉาก 2: มุมมองดอยสุเทพตระหง่าน
                    let r = Math.sqrt(x*x + y*y);
                    z = Math.max(0, (0.7 - r) * 0.5);
                } else if (scene === 2) { // ฉาก 3: มุมมองคูเมืองชั้นใน
                    z = (Math.abs(x) < 0.5 && Math.abs(y) < 0.5) ? 0.35 : -0.15;
                } else { // ฉาก 4: มิติจักรวาลลอยฟ้าเชียงใหม่
                    let angle = i * 0.002;
                    x = Math.cos(angle) * 1.3;
                    y = Math.sin(angle) * 1.3;
                    z = Math.sin(x * 5.0) * 0.3;
                }
                targets.push(x, y, z);
            }
            gl.bindBuffer(gl.ARRAY_BUFFER, buf2);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(targets), gl.DYNAMIC_DRAW);
        }

        canvas.addEventListener('click', () => {
            currentScene = (currentScene + 1) % 4;
            transition = 0.0;
            updateAerialTargets(currentScene);
        });

        updateAerialTargets(0);

        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        function render(now) {
            try {
                let t = (Date.now() - startTime) * 0.001;
                if (transition < 1.0) transition += 0.035;

                frameCount++;
                if (now - lastFpsUpdate >= 500) {
                    let currentFps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
                    hudFps.innerText = currentFps;
                    frameCount = 0;
                    lastFpsUpdate = now;
                }

                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.clearColor(0.0005, 0.001, 0.005, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                gl.uniform1f(uTime, t);
                gl.uniform1f(uTrans, transition);
                gl.uniform1i(uScene, currentScene);

                gl.drawArrays(gl.POINTS, 0, count);
                requestAnimationFrame(render);
            } catch (err) {
                console.error("Aerial Self-Healing Catch:", err);
            }
        }
        requestAnimationFrame(render);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
        });
    </script>
</body>
</html>
